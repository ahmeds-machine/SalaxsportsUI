<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arsenal:wght@400;700&family=Manrope:wght@400;500;600;700;800&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Manrope',system-ui,sans-serif;background:#ddd9d0;color:#0a1410;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  a:hover{color:#1f7a1f}
  ::selection{background:#e8ff3a;color:#0a1410}
  .sx-hide::-webkit-scrollbar{display:none}
  .sx-hide{scrollbar-width:none}
  @keyframes sxRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @keyframes sxSheet{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
  .sx-inp{width:100%;border:none;outline:none;background:transparent;font-family:'Manrope',sans-serif;font-size:14.5px;font-weight:600;color:#0a1410}
  .sx-inp::placeholder{color:rgba(10,20,16,.42);font-weight:500}
</style>
<script src="./image-slot.js"></script>
</helmet>

<div style="min-height:100vh;width:100%;display:flex;justify-content:center;background:#ddd9d0">
<div style="width:100%;max-width:430px;min-height:100vh;background:#eeeae2;position:relative;overflow:hidden;display:flex;flex-direction:column">

  <div style="position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#eeeae2 72%,rgba(238,234,226,0));padding:22px 20px 12px;display:flex;align-items:center;gap:12px">
    <a href="Salaxsports Hero.dc.html" style="font-family:'Permanent Marker',cursive;font-size:19px;line-height:1;letter-spacing:.01em;text-transform:uppercase;color:#0a1410;flex:1;min-width:0">SALA<span style="color:#1f7a1f">X</span>SPORTS</a>
    <button onClick="{{ toggleBell }}" style="width:44px;height:44px;flex:none;border-radius:50%;border:1px solid rgba(10,20,16,.07);background:#f7f5f0;color:#0a1410;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;box-shadow:0 2px 10px rgba(10,20,16,.06)" style-hover="background:#fff">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      <span style="position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:#e8ff3a;border:2px solid #f7f5f0"></span>
    </button>
  </div>

  <div style="padding:2px 20px 0;display:flex;align-items:center;gap:10px">
    <label style="flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:52px;padding:0 18px;border-radius:100px;background:#fbfaf7;border:1px solid rgba(10,20,16,.06);box-shadow:0 3px 14px rgba(10,20,16,.05)">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="rgba(10,20,16,.45)" stroke-width="2.1" stroke-linecap="round" style="flex:none"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      <input class="sx-inp" value="{{ query }}" onChange="{{ setQuery }}" placeholder="Search turf, arena or sports…">
    </label>
    <button onClick="{{ openFilters }}" style="width:52px;height:52px;flex:none;border-radius:50%;border:none;background:#1f7a1f;color:#eeeae2;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 18px rgba(31,122,31,.34)" style-hover="background:#186016">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M4 7h16"/><path d="M7 12h10"/><path d="M10 17h4"/></svg>
    </button>
  </div>

  <div style="padding:26px 0 8px 20px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-right:20px">
    <h2 style="font-family:'Arsenal';font-weight:700;font-size:20px;letter-spacing:-.01em;margin:0">Recommended for you</h2>
  </div>

  <div class="sx-hide" style="display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 20px 4px">
    <sc-for list="{{ featured }}" as="f" hint-placeholder-count="3">
      <button onClick="{{ f.onClick }}" style="scroll-snap-align:start;flex:none;width:calc(100% - 40px);max-width:346px;padding:0;border:none;cursor:pointer;position:relative;aspect-ratio:1/1.02;border-radius:24px;overflow:hidden;background:#0a1410;box-shadow:0 14px 34px rgba(10,20,16,.22);text-align:left;animation:sxRise .5s ease both">
        <div style="{{ f.bgStyle }}"></div>
        <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,14,10,.15) 0%,rgba(6,14,10,0) 38%,rgba(6,14,10,.82) 100%)"></div>
        <span style="position:absolute;top:14px;right:14px;display:flex;align-items:center;gap:5px;padding:7px 13px;border-radius:100px;background:rgba(251,250,247,.95);color:#0a1410;font-size:12px;font-weight:700;backdrop-filter:blur(6px)">{{ f.km }}</span>
        <div style="position:absolute;left:18px;right:18px;bottom:16px;display:flex;align-items:flex-end;gap:12px">
          <div style="min-width:0;flex:1">
            <div style="font-family:'Arsenal';font-weight:700;font-size:20px;line-height:1.1;color:#f3f6f2">{{ f.name }}</div>
            <div style="display:flex;align-items:center;gap:10px;margin-top:7px;color:rgba(243,246,242,.85);font-size:11.5px;font-weight:600;white-space:nowrap">
              <span style="display:inline-flex;align-items:center;gap:4px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/></svg>{{ f.district }}</span>
              <span style="display:inline-flex;align-items:center;gap:4px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="13" cy="4" r="1.6"/><path d="M8 21l3-6 3 2 1 4"/><path d="M6 12l3-3 4 2 3-1"/></svg>{{ f.km }}</span>
              <span style="display:inline-flex;align-items:center;gap:4px;color:#e8ff3a"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l2.6 5.6 6.1.8-4.5 4.2 1.2 6-5.4-3-5.4 3 1.2-6L3.3 9.4l6.1-.8z"/></svg><span style="color:#f3f6f2">{{ f.rating }}</span></span>
            </div>
          </div>
          <div style="font-family:'Arsenal';font-weight:700;font-size:22px;color:#e8ff3a;white-space:nowrap;line-height:1">{{ f.price }}</div>
        </div>
      </button>
    </sc-for>
  </div>

  <div style="display:flex;justify-content:center;gap:6px;padding:14px 0 0">
    <sc-for list="{{ dots }}" as="d" hint-placeholder-count="3">
      <span style="{{ d.style }}"></span>
    </sc-for>
  </div>

  <div style="padding:22px 20px 6px;display:flex;align-items:baseline;justify-content:space-between;gap:12px">
    <h2 style="font-family:'Arsenal';font-weight:700;font-size:20px;letter-spacing:-.01em;margin:0">Court Vibe Check</h2>
    <a href="Turf Fields.dc.html" style="font-size:12.5px;font-weight:700;color:rgba(10,20,16,.5)" style-hover="color:#1f7a1f">See All</a>
  </div>

  <div style="display:flex;flex-direction:column;gap:12px;padding:8px 20px 22px">
    <sc-for list="{{ courts }}" as="c" hint-placeholder-count="4">
      <button onClick="{{ c.onClick }}" style="display:flex;align-items:center;gap:13px;width:100%;padding:11px 13px;border:1px solid rgba(10,20,16,.06);border-radius:20px;background:#fbfaf7;box-shadow:0 3px 14px rgba(10,20,16,.05);cursor:pointer;text-align:left;transition:transform .18s ease,box-shadow .18s ease" style-hover="transform:translateY(-2px);box-shadow:0 10px 24px rgba(10,20,16,.1)">
        <div style="width:62px;height:62px;flex:none;border-radius:15px;overflow:hidden;background:#0a1410;position:relative">
          <image-slot id="{{ c.slotId }}" shape="rounded" radius="15" placeholder=""></image-slot>
        </div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:8px">
            <div style="font-family:'Arsenal';font-weight:700;font-size:16.5px;line-height:1.15;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ c.name }}</div>
            <span style="{{ c.badgeStyle }}"><span style="{{ c.dotStyle }}"></span>{{ c.vibe }}</span>
          </div>
          <div style="display:flex;align-items:center;gap:12px;margin-top:6px;color:rgba(10,20,16,.5);font-size:11.5px;font-weight:600;white-space:nowrap">
            <span style="display:inline-flex;align-items:center;gap:4px"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/></svg>{{ c.district }}</span>
            <span style="display:inline-flex;align-items:center;gap:4px"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="13" cy="4" r="1.6"/><path d="M8 21l3-6 3 2 1 4"/><path d="M6 12l3-3 4 2 3-1"/></svg>{{ c.km }}</span>
            <span style="margin-left:auto;color:#1f7a1f;font-weight:700">{{ c.slotsText }}</span>
          </div>
        </div>
      </button>
    </sc-for>
  </div>

  <div style="height:104px;flex:none"></div>

  <div style="position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;z-index:30;padding:10px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(238,234,226,0),#eeeae2 34%)">
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:7px;border-radius:26px;background:#fbfaf7;border:1px solid rgba(10,20,16,.06);box-shadow:0 10px 30px rgba(10,20,16,.13)">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4">
        <button onClick="{{ t.onClick }}" style="{{ t.style }}">
          <span style="{{ t.iconStyle }}">
            <sc-if value="{{ t.isHome }}" hint-placeholder-val="{{ true }}">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5L12 4l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19z"/><path d="M9.5 20.5v-6h5v6"/></svg>
            </sc-if>
            <sc-if value="{{ t.isBooking }}" hint-placeholder-val="{{ false }}">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.5h17"/><path d="M8 3.5v3M16 3.5v3"/><path d="M7.5 13.5h2M11 13.5h2M14.5 13.5h2M7.5 17h2M11 17h2"/></svg>
            </sc-if>
            <sc-if value="{{ t.isActivity }}" hint-placeholder-val="{{ false }}">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 16.5l5-5.5 3.5 3 4.5-6"/><path d="M13 8h4.5v4.5"/></svg>
            </sc-if>
            <sc-if value="{{ t.isProfile }}" hint-placeholder-val="{{ false }}">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.8 20.5v-.8a5.7 5.7 0 0 1 5.7-5.7h3a5.7 5.7 0 0 1 5.7 5.7v.8"/></svg>
            </sc-if>
          </span>
          <span style="{{ t.labelStyle }}">{{ t.label }}</span>
        </button>
      </sc-for>
    </div>
  </div>

  <sc-if value="{{ filtersOpen }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeSheet }}" style="position:fixed;inset:0;z-index:60;background:rgba(6,14,10,.5);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center">
      <div onClick="{{ stop }}" style="width:100%;max-width:430px;background:#0a1410;color:#f3f6f2;border-radius:26px 26px 0 0;padding:12px 22px calc(26px + env(safe-area-inset-bottom));animation:sxSheet .28s cubic-bezier(.2,.9,.3,1) both">
        <div style="width:42px;height:4px;border-radius:4px;background:rgba(255,255,255,.22);margin:0 auto 18px"></div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
          <span style="font-family:'Arsenal';font-weight:700;font-size:19px;text-transform:uppercase">Filter fields</span>
          <button onClick="{{ closeSheet }}" style="width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:transparent;color:#f3f6f2;font-size:15px;cursor:pointer;line-height:1">✕</button>
        </div>
        <div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.5;margin-bottom:10px">District</div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px">
          <sc-for list="{{ districts }}" as="d" hint-placeholder-count="4">
            <button onClick="{{ d.onClick }}" style="{{ d.style }}">{{ d.label }}</button>
          </sc-for>
        </div>
        <div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.5;margin-bottom:10px">Vibe</div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px">
          <sc-for list="{{ vibeFilters }}" as="v" hint-placeholder-count="3">
            <button onClick="{{ v.onClick }}" style="{{ v.style }}">{{ v.label }}</button>
          </sc-for>
        </div>
        <button onClick="{{ closeSheet }}" style="width:100%;height:54px;border:none;border-radius:100px;background:#e8ff3a;color:#0a1410;font-family:'Arsenal';font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.03em;cursor:pointer">Show {{ resultCount }} fields</button>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ bellOpen }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeSheet }}" style="position:fixed;inset:0;z-index:60;background:rgba(6,14,10,.5);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center">
      <div onClick="{{ stop }}" style="width:100%;max-width:430px;background:#0a1410;color:#f3f6f2;border-radius:26px 26px 0 0;padding:12px 22px calc(26px + env(safe-area-inset-bottom));animation:sxSheet .28s cubic-bezier(.2,.9,.3,1) both">
        <div style="width:42px;height:4px;border-radius:4px;background:rgba(255,255,255,.22);margin:0 auto 18px"></div>
        <div style="font-family:'Arsenal';font-weight:700;font-size:19px;text-transform:uppercase;margin-bottom:16px">Notifications</div>
        <div style="display:flex;flex-direction:column;gap:2px">
          <sc-for list="{{ notifs }}" as="n" hint-placeholder-count="3">
            <div style="display:flex;gap:13px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.08)">
              <span style="width:8px;height:8px;border-radius:50%;background:#e8ff3a;flex:none;margin-top:6px"></span>
              <div style="min-width:0"><div style="font-size:14px;font-weight:700;line-height:1.3">{{ n.title }}</div><div style="font-size:12.5px;font-weight:500;opacity:.6;margin-top:3px">{{ n.body }}</div></div>
              <span style="margin-left:auto;font-size:11px;font-weight:600;opacity:.4;white-space:nowrap">{{ n.time }}</span>
            </div>
          </sc-for>
        </div>
      </div>
    </div>
  </sc-if>

</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:430,&quot;height&quot;:932},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#e8ff3a&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#e8ff3a&quot;,&quot;#29c5f6&quot;,&quot;#38e8c0&quot;,&quot;#ff6b35&quot;]}}">
class Component extends DCLogic {
  state = { tab:'Home', query:'', sheet:null, district:'All', vibe:'All' };
  FEATURED = [
    { name:'Downtown Arena', district:'Hodan', km:'0.8 km', rating:'4.9', price:'$45/hr', photo:"uploads/photo-1546608235-3310a2494cdf.avif" },
    { name:'Coast 5-a-side', district:'Waberi', km:'2.1 km', rating:'4.7', price:'$38/hr', photo:null, slotId:'feat-2' },
    { name:'Elite Futsal Dome', district:'Wadajir', km:'3.4 km', rating:'4.8', price:'$52/hr', photo:null, slotId:'feat-3' },
  ];
  COURTS = [
    ['Hodan Sports Park','Hodan','1.2 km','Quiet',4],
    ['Waberi Turf','Waberi','2.8 km','Moderate',2],
    ['Wadajir Arena','Wadajir','3.9 km','Busy',1],
    ['Sahil Boyu Turf','Hodan','4.6 km','Quiet',6],
  ];
  NOTIFS = [
    { title:'Your booking is confirmed', body:'Downtown Arena — Mon, July 27 at 19:00', time:'2m' },
    { title:'Your goal hit 1,200 points', body:'“Top Corner” is climbing the weekly leaderboard', time:'1h' },
    { title:'New field near you', body:'Elite Futsal Dome opened in Wadajir', time:'1d' },
  ];
  renderVals() {
    const accent = this.props.accent || '#e8ff3a';
    const dark = '#0a1410', green = '#1f7a1f';
    const VIBE = { Quiet:['rgba(31,122,31,.12)', green], Moderate:['rgba(214,148,20,.14)','#a06f0a'], Busy:['rgba(204,50,50,.12)','#b23b3b'] };

    const featured = this.FEATURED.map((f, i) => ({
      ...f,
      bgStyle: f.photo
        ? "position:absolute;inset:0;background-image:url('" + f.photo + "');background-size:cover;background-position:center"
        : "position:absolute;inset:0;background:linear-gradient(150deg,#12261a,#0a1410 62%)",
      onClick: () => {},
    }));

    const dots = this.FEATURED.map((f, i) => ({
      style: 'width:' + (i === 0 ? '18px' : '6px') + ';height:6px;border-radius:6px;background:' + (i === 0 ? green : 'rgba(10,20,16,.18)'),
    }));

    const courts = this.COURTS
      .filter(c => this.state.district === 'All' || c[1] === this.state.district)
      .filter(c => this.state.vibe === 'All' || c[3] === this.state.vibe)
      .filter(c => !this.state.query || c[0].toLowerCase().includes(this.state.query.toLowerCase()))
      .map((c, i) => {
        const v = VIBE[c[3]];
        return {
          name:c[0], district:c[1], km:c[2], vibe:c[3],
          slotsText: '• ' + c[4] + ' slots free',
          slotId: 'court-' + c[0].replace(/\W+/g,'-').toLowerCase(),
          badgeStyle: 'display:inline-flex;align-items:center;gap:5px;flex:none;padding:5px 11px;border-radius:100px;background:' + v[0] + ';color:' + v[1] + ';font-size:11px;font-weight:700',
          dotStyle: 'width:6px;height:6px;border-radius:50%;background:' + v[1],
          onClick: () => {},
        };
      });

    const tabs = ['Home','Booking','Activity','Profile'].map(name => {
      const on = this.state.tab === name;
      return {
        label:name,
        isHome: name === 'Home', isBooking: name === 'Booking',
        isActivity: name === 'Activity', isProfile: name === 'Profile',
        style: 'display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:56px;padding:8px 4px;border:none;border-radius:19px;cursor:pointer;font-family:Manrope,sans-serif;background:' + (on ? dark : 'transparent'),
        iconStyle: 'display:flex;align-items:center;justify-content:center;line-height:0;color:' + (on ? accent : 'rgba(10,20,16,.42)'),
        labelStyle: 'font-size:11px;font-weight:' + (on ? 700 : 600) + ';color:' + (on ? '#f3f6f2' : 'rgba(10,20,16,.42)'),
        onClick: () => this.setState({ tab:name }),
      };
    });

    const chip = (label, active) => 'padding:9px 16px;border-radius:100px;border:1px solid ' + (active ? accent : 'rgba(255,255,255,.16)') + ';background:' + (active ? accent : 'transparent') + ';color:' + (active ? dark : '#f3f6f2') + ';font-family:Manrope,sans-serif;font-size:13px;font-weight:700;cursor:pointer';
    const districts = ['All','Hodan','Waberi','Wadajir'].map(d => ({
      label:d, style: chip(d, this.state.district === d), onClick: () => this.setState({ district:d }),
    }));
    const vibeFilters = ['All','Quiet','Moderate','Busy'].map(v => ({
      label:v, style: chip(v, this.state.vibe === v), onClick: () => this.setState({ vibe:v }),
    }));

    return {
      featured, dots, courts, tabs, districts, vibeFilters,
      notifs: this.NOTIFS,
      query: this.state.query,
      resultCount: courts.length,
      setQuery: (e) => this.setState({ query: e.target.value }),
      filtersOpen: this.state.sheet === 'filters',
      bellOpen: this.state.sheet === 'bell',
      openFilters: () => this.setState({ sheet:'filters' }),
      toggleBell: () => this.setState({ sheet:'bell' }),
      closeSheet: () => this.setState({ sheet:null }),
      stop: (e) => e.stopPropagation(),
    };
  }
}

</script>
</body>
</html>
